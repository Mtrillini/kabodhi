<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado del pago — KABODHI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=49">
</head>
<body class="page-checkout">

  <div id="navbar"></div>

  <div class="checkout-resultado">
    <div class="checkout-resultado__box">
      <div id="result-icon" class="checkout-resultado__icon"></div>
      <h1 id="result-title" class="checkout-resultado__title"></h1>
      <p id="result-msg" class="checkout-resultado__msg"></p>
      <p id="result-pedido" class="checkout-resultado__pedido"></p>
      <a href="index.html" class="order-summary__btn-primary" style="display:inline-block;margin-top:2rem;padding:0.9rem 2.5rem;">
        VOLVER AL INICIO
      </a>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/config.js?v=33"></script>
  <script src="js/main.js?v=35"></script>
  <script src="js/carrito.js?v=33"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params    = new URLSearchParams(window.location.search);
      const status    = params.get('status')    || 'pending';
      const pedidoId  = params.get('pedido_id') || '';

      const configs = {
        success: {
          icon:  '✦',
          color: '#7cb87c',
          title: '¡Pago aprobado!',
          msg:   'Gracias por tu compra. Tu pedido ha sido confirmado y nos pondremos en contacto para coordinar el envío.',
        },
        failure: {
          icon:  '◇',
          color: '#c07b7b',
          title: 'Pago rechazado',
          msg:   'Tu pago no pudo ser procesado. Podés intentarlo nuevamente o contactarnos para encontrar una solución.',
        },
        pending: {
          icon:  '◆',
          color: '#c8b89e',
          title: 'Pago pendiente',
          msg:   'Tu pago está siendo procesado. Te notificaremos por email cuando se confirme. Gracias por tu paciencia.',
        },
      };

      const config = configs[status] || configs.pending;
      const iconEl  = document.getElementById('result-icon');
      iconEl.textContent = config.icon;
      iconEl.style.color = config.color;
      document.getElementById('result-title').textContent = config.title;
      document.getElementById('result-msg').textContent   = config.msg;

      if (pedidoId) {
        document.getElementById('result-pedido').textContent = `Número de pedido: #${pedidoId}`;
      }

      if (status === 'success' && window.Carrito) {
        window.Carrito.vaciar();
      }
    });
  </script>
</body>
</html>
