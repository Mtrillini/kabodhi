  <script>
    function handleNewsletter(e) {
      e.preventDefault();
      const email = e.target.querySelector('input[type="email"]').value;
      if (email) {
        showToast('¡Gracias por suscribirte a KABODHI!', 'success');
        e.target.reset();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadHongosPrincipales();
      cargarCombosHome();
    });

    // ---- Combos y ofertas (seccion opcional del home) ----
    async function cargarCombosHome() {
      const seccion = document.getElementById('home-promos');
      const grid    = document.getElementById('home-promos-grid');
      if (!seccion || !grid || typeof loadPromosData !== 'function') return;

      try {
        const json   = await loadPromosData();
        const promos = (json.data || []).filter(p => p.activo === undefined || parseInt(p.activo) === 1);
        if (!promos.length) return;   // seccion queda oculta

        const fmt = window.formatMoney || (v => '$ ' + v.toLocaleString('es-AR'));
        grid.innerHTML = promos.slice(0, 3).map(p => `
          <a class="home-promo-card reveal reveal--up" href="${PAGES_BASE}/promo?id=${p.id}">
            <div class="home-promo-card__img-wrap">
              ${p.imagen_url ? `<img src="${escAtributo(p.imagen_url)}" alt="${escAtributo(p.nombre)}" loading="lazy">` : ''}
            </div>
            <div class="home-promo-card__body">
              <div class="home-promo-card__nombre">${escAtributo(p.nombre)}</div>
              <div class="home-promo-card__elegir">Incluye ${p.cantidad_items} productos</div>
              <div class="home-promo-card__precio">${fmt(p.precio)}</div>
            </div>
          </a>
        `).join('');

        seccion.hidden = false;
        if (window.observeReveals) window.observeReveals(seccion);
      } catch (e) {
        console.error('Error cargando combos del inicio:', e);
      }
    }

    // ---- Hongos principales (seccion alternada) ----
    async function loadHongosPrincipales() {
      const cont = document.getElementById('hongos-list');
      if (!cont) return;

      // Icono de respaldo para un hongo sin imagen propia.
      const ICONO_HOJA = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>';
      const _base = 'images/';
      const ICON_IMG = {
        'melena de leon': _base + 'icon-hongo-enfoque.webp',
        'reishi':         _base + 'icon-hongo-equilibrio.webp',
        'cordyceps':      _base + 'icon-hongo-energia.webp',
        'shiitake':       _base + 'icon-hongo-bienestar.webp',
        'ashwagandha':    _base + 'icon-hongo-bienestar.webp',
      };
      const norm = s => (s || '').toLowerCase()
        .normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]', 'g'), '');

      try {
        const json = await loadHongosData();
        if (!json.success || !json.data || !json.data.length) { cont.innerHTML = ''; return; }

        cont.innerHTML = json.data.map((h, i) => {
          const key      = norm(h.nombre);
          const iconImg  = ICON_IMG[key];
          const iconHtml = iconImg
            ? `<img src="${iconImg}" alt="" class="hongo-row__iconimg">`
            : ICONO_HOJA;
          const side = i % 2 === 0 ? 'hongo-row--img-right' : 'hongo-row--img-left';
          const dir  = i % 2 === 0 ? 'reveal--right' : 'reveal--left';
          const link = (typeof PAGES_BASE !== 'undefined' ? PAGES_BASE : '') +
                       '/productos?search=' + encodeURIComponent(h.nombre);
          const img  = h.imagen_url || '';
          return `
            <article class="hongo-row ${side} reveal ${dir}">
              <div class="hongo-row__media">
                <img src="${img}" alt="${h.nombre}" loading="lazy">
              </div>
              <div class="hongo-row__body">
                <div class="hongo-row__icon">${iconHtml}</div>
                <h2 class="hongo-row__title">${h.nombre}</h2>
                ${h.subtitulo ? `<p class="hongo-row__sub">${h.subtitulo}</p>` : ''}
                ${h.descripcion ? `<p class="hongo-row__desc">${h.descripcion}</p>` : ''}
                <a href="${link}" class="hongo-row__cta">AGREGAR &rarr;</a>
              </div>
            </article>`;
        }).join('');
        if (window.observeReveals) window.observeReveals(cont);
      } catch (e) {
        console.error('Error cargando hongos principales:', e);
        cont.innerHTML = '';
      }
    }

    // ---- Hero slider ----
    // Los banners se administran desde el panel. Lo que viene en el HTML es el
    // contenido inicial: si la API no responde, el inicio igual muestra el
    // carrusel en vez de un hueco.
    let heroTimer = null;

    function iniciarHero() {
      const track = document.getElementById('hero-track');
      if (!track) return;

      if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }

      const total = track.children.length;
      const dots  = Array.from(document.querySelectorAll('.hero__dot'));
      let current = 0;

      function goTo(i, precargar = true) {
        current = (i + total) % total;
        track.style.transform = `translateX(-${current * 100}%)`;
        dots.forEach((d, x) => d.classList.toggle('active', x === current));
        if (precargar) precargarSiguiente();
      }

      // El banner que viene se empieza a bajar apenas se muestra el actual,
      // asi llega cargado y no se ve el hueco al pasar de uno a otro.
      function precargarSiguiente() {
        const siguiente = track.children[(current + 1) % total];
        const img = siguiente && siguiente.querySelector('img');
        if (img && img.loading === 'lazy') img.loading = 'eager';
      }
      function startAuto() { heroTimer = setInterval(() => goTo(current + 1), 5500); }

      dots.forEach(d => {
        if (d.dataset.enlazado) return;
        d.dataset.enlazado = '1';
        d.addEventListener('click', () => {
          clearInterval(heroTimer);
          goTo(parseInt(d.dataset.i, 10));
          startAuto();
        });
      });

      // El primer goTo no precarga: al abrir la pagina lo unico que tiene que
      // bajarse es el banner que se ve. El segundo empieza un rato despues,
      // cuando el resto del inicio ya cargo.
      goTo(0, false);
      if (total > 1) {
        startAuto();
        setTimeout(precargarSiguiente, 1500);
      }
    }

    // Si la API no trae banners, se usa el respaldo del <template>.
    function usarRespaldo() {
      const track = document.getElementById('hero-track');
      const tpl   = document.getElementById('hero-respaldo');
      if (!track || !tpl || track.children.length) return;
      track.appendChild(tpl.content.cloneNode(true));
      iniciarHero();
    }

    (async () => {
      if (typeof loadBannersData !== 'function') { usarRespaldo(); return; }

      try {
        const json    = await loadBannersData();
        const banners = json.data || json;
        if (!Array.isArray(banners) || !banners.length) { usarRespaldo(); return; }

        const track = document.getElementById('hero-track');
        if (!track) return;

        track.innerHTML = banners.map((b, i) => {
          const desktop = b.imagen_desktop || '';
          const mobile  = b.imagen_mobile || desktop;
          // Solo el primer banner se baja de entrada; los demas recien cuando
          // el carrusel los va a mostrar. Con 4 banners pesados, cargarlos
          // todos juntos hacia esperar al visitante por imagenes que todavia
          // no veia.
          const carga = i === 0
            ? 'fetchpriority="high" decoding="async"'
            : 'loading="lazy" decoding="async"';
          // Encuadre elegido en el panel: que parte de la imagen queda a la
          // vista y cuanto se acerca.
          const fx = Number.isFinite(+b.foco_x) ? +b.foco_x : 50;
          const fy = Number.isFinite(+b.foco_y) ? +b.foco_y : 50;
          const zm = (Number.isFinite(+b.zoom) ? +b.zoom : 100) / 100;
          const encuadre = `--foco-x:${fx}%;--foco-y:${fy}%;--zoom:${zm};`;

          const img = `<picture>
                <source media="(max-width: 768px)" srcset="${escAtributo(mobile)}">
                <img class="hero__img" src="${escAtributo(desktop)}" alt="${escAtributo(b.titulo || '')}" style="${encuadre}" ${carga}>
              </picture>`;

          // Con texto de boton se dibuja el boton y la imagen deja de ser un
          // link (un <a> dentro de otro <a> no es HTML valido).
          const conBoton = b.boton_texto && b.link;
          if (conBoton) {
            // Cada banner trae su texto a distinta distancia del borde, asi que
            // el boton se alinea con el de SU banner.
            const bx = Number.isFinite(+b.boton_x) ? +b.boton_x : 12;
            return `<div class="hero__slide">${img}
              <a class="hero__btn" style="left:${bx}%" href="${escAtributo(b.link)}">
                ${escAtributo(b.boton_texto)}<span class="hero__btn-flecha" aria-hidden="true">&#8594;</span>
              </a>
            </div>`;
          }
          return `<div class="hero__slide">${
            b.link ? `<a href="${escAtributo(b.link)}">${img}</a>` : img
          }</div>`;
        }).join('');

        iniciarHero();
      } catch {
        usarRespaldo();
      }
    })();

    function escAtributo(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML.replace(/"/g, '&quot;');
    }
  </script>
