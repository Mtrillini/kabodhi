<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KABODHI — Finalizar compra.">
  <title>Checkout — KABODHI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=70">
</head>
<body class="page-checkout">

  <div id="navbar"></div>


  <!-- Título de página -->
  <div class="cart-page-header">
    <h1 class="cart-page-title">Finalizar Compra</h1>
  </div>

  <div class="checkout-layout">

    <!-- Formulario -->
    <div>

      <!-- Progress -->
      <div class="checkout-progress">
        <div class="progress-step done">
          <span class="progress-step__num">✓</span>
          <span>Carrito</span>
        </div>
        <div class="progress-divider"></div>
        <div class="progress-step active">
          <span class="progress-step__num">2</span>
          <span>Datos</span>
        </div>
        <div class="progress-divider"></div>
        <div class="progress-step">
          <span class="progress-step__num">3</span>
          <span>Pago</span>
        </div>
      </div>

      <h2 class="checkout-form__title">Tus datos</h2>

      <form id="checkout-form" novalidate>
        <div class="form-grid">

          <div class="form-group">
            <label class="form-label" for="nombre">Nombre</label>
            <input type="text" id="nombre" class="form-input" required autocomplete="given-name" placeholder="Juan">
            <span class="form-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="apellido">Apellido</label>
            <input type="text" id="apellido" class="form-input" required autocomplete="family-name" placeholder="Pérez">
            <span class="form-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-input" required autocomplete="email" placeholder="juan@email.com">
            <span class="form-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="telefono">Teléfono</label>
            <input type="tel" id="telefono" class="form-input" required autocomplete="tel" placeholder="+54 11 5555-0000">
            <span class="form-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="dni">DNI</label>
            <input type="text" id="dni" class="form-input" required inputmode="numeric"
                   autocomplete="off" placeholder="30123456" maxlength="10">
            <span class="form-error"></span>
            <p style="font-size:0.7rem;color:var(--taupe);margin-top:0.3rem;">
              Lo necesitamos para la factura y para el despacho del envío.
            </p>
          </div>

        </div>

        <h2 class="checkout-form__title" style="margin-top:2rem;">Envío</h2>

        <div class="form-grid">

          <div class="form-group">
            <label class="form-label" for="cp">Código Postal</label>
            <div style="display:flex;gap:0.5rem;">
              <input type="text" id="cp" class="form-input" required autocomplete="postal-code" inputmode="numeric" placeholder="1425" maxlength="8" style="flex:1;">
              <button type="button" id="btn-cotizar" class="btn-cotizar">Calcular</button>
            </div>
            <span class="form-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="provincia">Provincia</label>
            <select id="provincia" class="form-input" required autocomplete="address-level1">
              <option value="">Elegí tu provincia</option>
            </select>
            <span class="form-error"></span>
          </div>

          <div class="form-group form-group--full">
            <div id="envio-msg" style="font-size:0.72rem;color:var(--taupe);min-height:1rem;"></div>
            <div id="envio-opciones" class="envio-opciones"></div>
          </div>

          <!-- Retiro en sucursal: solo se muestra si la opcion elegida lo pide -->
          <div class="form-group form-group--full" id="grupo-sucursal" hidden>
            <label class="form-label" for="sucursal">Sucursal de Correo Argentino</label>
            <select id="sucursal" class="form-input">
              <option value="">Elegí la provincia para ver las sucursales</option>
            </select>
            <span class="form-error"></span>
            <p style="font-size:0.7rem;color:var(--taupe);margin-top:0.3rem;">
              Vas a poder retirarlo con tu DNI cuando te avisemos que llegó.
            </p>
          </div>

          <!-- Domicilio -->
          <div class="form-group form-group--full" id="grupo-calle">
            <label class="form-label" for="calle">Calle</label>
            <input type="text" id="calle" class="form-input" required autocomplete="address-line1" placeholder="Av. Santa Fe">
            <span class="form-error"></span>
          </div>

          <div class="form-group" id="grupo-numero">
            <label class="form-label" for="numero">Número</label>
            <input type="text" id="numero" class="form-input" required inputmode="numeric" placeholder="1234" maxlength="10">
            <span class="form-error"></span>
          </div>

          <div class="form-group" id="grupo-piso">
            <label class="form-label" for="piso_depto">Piso / Depto <span style="color:var(--taupe);font-weight:400;">(opcional)</span></label>
            <input type="text" id="piso_depto" class="form-input" autocomplete="address-line2" placeholder="Piso 3, Depto A" maxlength="50">
            <span class="form-error"></span>
          </div>

          <div class="form-group form-group--full" id="grupo-ciudad">
            <label class="form-label" for="ciudad">Ciudad / Localidad</label>
            <input type="text" id="ciudad" class="form-input" required autocomplete="address-level2" placeholder="Buenos Aires">
            <span class="form-error"></span>
          </div>

        </div>

        <h2 class="checkout-form__title" style="margin-top:2rem;">Forma de pago</h2>

        <div class="envio-opciones" id="pago-opciones">
          <label class="envio-opcion envio-opcion--activa">
            <input type="radio" name="metodo-pago" value="mercadopago" checked>
            <span class="envio-opcion__texto">
              <span class="envio-opcion__nombre">Mercado Pago</span>
              <span class="envio-opcion__plazo" id="pago-mp-detalle">Tarjeta de crédito, débito o dinero en cuenta.</span>
            </span>
          </label>
          <label class="envio-opcion" id="pago-transferencia" hidden>
            <input type="radio" name="metodo-pago" value="transferencia">
            <span class="envio-opcion__texto">
              <span class="envio-opcion__nombre">Transferencia bancaria</span>
              <span class="envio-opcion__plazo" id="pago-transf-detalle">Un solo pago. Te mostramos los datos al confirmar.</span>
            </span>
            <span class="envio-opcion__precio" id="pago-transf-descuento"></span>
          </label>
        </div>

        <div class="checkout-submit">
          <button type="submit" id="btn-pagar" class="checkout-submit__btn">
            PAGAR CON MERCADOPAGO
          </button>
          <a href="carrito" class="checkout-submit__back">← Volver al carrito</a>
        </div>

      </form>
    </div>

    <!-- Resumen del pedido -->
    <div id="checkout-summary"></div>

  </div>

  <!-- WhatsApp flotante -->
  <a href="https://wa.me/541139225427" class="whatsapp-btn" target="_blank" aria-label="WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <div id="footer"></div>

  <script src="js/config.js?v=36"></script>
  <script src="js/main.js?v=42"></script>
  <script src="js/carrito.js?v=61"></script>
  <script src="js/pagos.js?v=2"></script>
  <script src="js/envio.js?v=1"></script>
  <script src="js/checkout.js?v=37"></script>
</body>
</html>
