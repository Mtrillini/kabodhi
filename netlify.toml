# Deploy estatico en Netlify. El sitio esta en la raiz del repo.
# Netlify sirve URLs limpias automaticamente (/productos -> productos.html).
# Las carpetas api/ y admin/ (PHP) solo funcionan en un hosting con PHP; en
# el sitio estatico se ignoran (nada las enlaza) y los datos se leen de data/*.json.
[build]
  publish = "."
