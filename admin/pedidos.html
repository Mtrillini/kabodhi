<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos — KABODHI Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=6">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" data-page="pedidos"></aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:1rem;">
        <button class="hamburger-admin" id="hamburger-admin" aria-label="Menú">
          <span></span><span></span><span></span>
        </button>
        <span class="topbar__title">Pedidos</span>
      </div>
      <div class="topbar__actions">
        <button id="btn-exportar" class="btn btn-secondary btn-sm">↓ Exportar CSV</button>
        <button id="btn-actualizar" class="btn btn-secondary btn-sm">↺ Actualizar</button>
      </div>
    </div>

    <div class="content">
      <div class="panel">
        <div class="panel__header">
          <div class="admin-search" style="display:flex;gap:0.6rem;flex-wrap:wrap;align-items:center;">
            <input
              type="search"
              id="search-pedidos"
              class="search-input"
              placeholder="Buscar por #, cliente o email..."
              style="min-width:220px;"
            >
            <select id="filter-estado" class="filter-select">
              <option value="">Todos los estados</option>
              <option value="pendiente">Pendiente</option>
              <option value="aprobado">Aprobado</option>
              <option value="enviado">Enviado</option>
              <option value="entregado">Entregado</option>
              <option value="rechazado">Rechazado</option>
              <option value="cancelado">Cancelado</option>
            </select>
            <label style="font-size:0.7rem;color:var(--taupe);display:flex;align-items:center;gap:0.35rem;">
              Desde
              <input type="date" id="filter-desde" class="filter-select" style="padding:0.35rem 0.5rem;">
            </label>
            <label style="font-size:0.7rem;color:var(--taupe);display:flex;align-items:center;gap:0.35rem;">
              Hasta
              <input type="date" id="filter-hasta" class="filter-select" style="padding:0.35rem 0.5rem;">
            </label>
            <button id="btn-limpiar-filtros" class="btn btn-secondary btn-sm">Limpiar</button>
          </div>
        </div>

        <div id="resumen-filtros" style="padding:0.75rem 1.5rem;font-size:0.72rem;color:var(--taupe);border-bottom:1px solid var(--champagne);"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Cliente</th>
                <th>Email</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="pedidos-tbody">
              <tr><td colspan="7" class="loading">Cargando...</td></tr>
            </tbody>
          </table>
        </div>

        <div style="padding:1rem 1.5rem;font-size:0.72rem;color:var(--taupe);">
          Hacé clic en una fila para ver el detalle del pedido.
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=6"></script>
  <script src="js/layout.js?v=6"></script>
  <script src="js/demo.js?v=6"></script>
  <script src="js/auth.js?v=6"></script>
  <script src="js/pedidos.js?v=6"></script>
</body>
</html>
