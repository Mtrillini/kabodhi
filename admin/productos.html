<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos — KABODHI Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__header">
      <span class="sidebar__logo">KABODHI</span>
      <span class="sidebar__subtitle">Admin Panel</span>
    </div>

    <nav class="sidebar__nav">
      <div class="sidebar__nav-label">Principal</div>
      <a href="dashboard.html" class="sidebar__link">
        <span class="sidebar__link-icon">◈</span> Dashboard
      </a>
      <a href="productos.html" class="sidebar__link active">
        <span class="sidebar__link-icon">◆</span> Productos
      </a>
      <a href="hongos.html" class="sidebar__link">
        <span class="sidebar__link-icon">✦</span> Hongos principales
      </a>
      <a href="pedidos.html" class="sidebar__link">
        <span class="sidebar__link-icon">◇</span> Pedidos
      </a>

      <a href="envios.html" class="sidebar__link">
        <span class="sidebar__link-icon">◎</span> Envíos
      </a>
      <div class="sidebar__nav-label" style="margin-top:1.5rem;">Tienda</div>
      <a href="../frontend/index.html" target="_blank" class="sidebar__link">
        <span class="sidebar__link-icon">↗</span> Ver tienda
      </a>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__user">Bienvenido, <span id="admin-username">Admin</span></div>
      <button class="sidebar__logout" id="btn-logout">
        <span>↩</span> Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:1rem;">
        <button class="hamburger-admin" id="hamburger-admin" aria-label="Menú">
          <span></span><span></span><span></span>
        </button>
        <span class="topbar__title">Productos</span>
      </div>
      <div class="topbar__actions">
        <button id="btn-nuevo-producto" class="btn btn-primary">+ Nuevo Producto</button>
      </div>
    </div>

    <div class="content">
      <div class="panel">
        <div class="panel__header">
          <div class="admin-search">
            <input
              type="search"
              id="search-productos"
              class="search-input"
              placeholder="Buscar por nombre, categoría, tipo..."
            >
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Tipo</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="productos-tbody">
              <tr><td colspan="8" class="loading">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Crear / Editar Producto -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal__header">
        <span class="modal__title" id="modal-title">Nuevo Producto</span>
        <button class="modal__close" id="btn-close-modal">✕</button>
      </div>
      <div class="modal__body">
        <form id="producto-form" onsubmit="event.preventDefault();">

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="f-marca">Beneficio (tag) *</label>
              <input type="text" id="f-marca" class="form-input" required placeholder="Enfoque">
            </div>

            <div class="form-group">
              <label class="form-label" for="f-nombre">Nombre del producto *</label>
              <input type="text" id="f-nombre" class="form-input" required placeholder="Melena de León">
            </div>

            <div class="form-group">
              <label class="form-label" for="f-categoria">Categoría *</label>
              <select id="f-categoria" class="form-select">
                <option value="1">Adaptógenos</option>
                <option value="2">Blends</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="f-tipo">Objetivo *</label>
              <select id="f-tipo" class="form-select">
                <option value="enfoque">Enfoque</option>
                <option value="energia">Energía</option>
                <option value="equilibrio">Equilibrio</option>
                <option value="defensas">Defensas</option>
                <option value="bienestar">Bienestar</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="f-precio">Precio (ARS) *</label>
              <input type="number" id="f-precio" class="form-input" required min="0" step="0.01" placeholder="28900">
            </div>

            <div class="form-group">
              <label class="form-label" for="f-stock">Stock</label>
              <input type="number" id="f-stock" class="form-input" min="0" placeholder="10">
            </div>

            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label">Imágenes del producto</label>
              <div id="f-imagenes-lista" style="display:flex;flex-wrap:wrap;gap:0.6rem;margin-bottom:0.8rem;"></div>
              <label style="display:inline-flex;align-items:center;gap:0.5rem;cursor:pointer;padding:0.5rem 1rem;border:1px solid var(--champagne);border-radius:var(--radius);font-size:0.75rem;font-family:var(--font);color:var(--negro);background:transparent;transition:background var(--transition);" onmouseover="this.style.background='var(--crema)'" onmouseout="this.style.background='transparent'">
                + Agregar fotos
                <input type="file" id="f-imagen-file" multiple accept="image/jpeg,image/png,image/webp,image/gif" style="display:none;">
              </label>
            </div>

            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label" for="f-nota">Formato / bajada corta</label>
              <input type="text" id="f-nota" class="form-input" placeholder="Enfoque & claridad · 60 cápsulas">
            </div>

            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label" for="f-descripcion">Descripción</label>
              <textarea id="f-descripcion" class="form-textarea" rows="4" placeholder="Hericium erinaceus de doble extracción..."></textarea>
            </div>

            <div class="form-group" style="display:flex;flex-direction:row;align-items:center;gap:0.5rem;grid-column:1/-1;">
              <input type="checkbox" id="f-destacado" style="width:16px;height:16px;accent-color:var(--negro);">
              <label class="form-label" for="f-destacado" style="margin:0;">Destacar en "Más Vendidos"</label>
            </div>

            <div class="form-group" style="display:flex;flex-direction:row;align-items:center;gap:0.5rem;grid-column:1/-1;">
              <input type="checkbox" id="f-activo" style="width:16px;height:16px;accent-color:var(--negro);">
              <label class="form-label" for="f-activo" style="margin:0;">Activo (visible en la tienda)</label>
            </div>
          </div>

        </form>
      </div>
      <div class="modal__footer">
        <button class="btn btn-secondary" id="btn-cancel-modal">Cancelar</button>
        <button class="btn btn-primary" id="btn-save" onclick="saveProducto()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
